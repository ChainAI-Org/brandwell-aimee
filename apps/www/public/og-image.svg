<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BrandWell's AIMEE</title>
  <desc id="desc">A done-for-you AI employee with managed skills, models, and a dedicated computer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090d" />
      <stop offset="0.55" stop-color="#11101a" />
      <stop offset="1" stop-color="#09090d" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed3988" />
      <stop offset="0.5" stop-color="#9837e6" />
      <stop offset="1" stop-color="#5638ff" />
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e05bc3" />
      <stop offset="0.5" stop-color="#8c3bff" />
      <stop offset="1" stop-color="#3c2bc0" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9e4dff" stop-opacity="0.26" />
      <stop offset="1" stop-color="#9e4dff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1060" cy="70" r="330" fill="url(#glow)" />
  <circle cx="170" cy="620" r="300" fill="url(#glow)" opacity="0.45" />
  <path d="M0 555 C270 480 470 630 790 545 C970 498 1080 512 1200 470 V630 H0 Z" fill="#6f36e0" opacity="0.08" />

  <g transform="translate(72 62)">
    <g aria-label="BrandWell logo">
      <path d="M8 26 C14 8 28 2 45 5 C35 12 32 22 34 36 C23 34 15 31 8 26 Z" fill="url(#brand)" />
      <path d="M21 33 C24 18 35 9 51 8 C42 17 42 29 46 43 C34 42 26 39 21 33 Z" fill="#7c31d5" opacity="0.86" />
      <text x="62" y="34" fill="#f5f2f7" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">BrandWell</text>
    </g>

    <text x="0" y="168" fill="#a995ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">DONE-FOR-YOU AI EMPLOYEE</text>
    <text x="0" y="280" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="-5">AIMEE</text>
    <text x="2" y="330" fill="#b9b5c6" font-family="Arial, Helvetica, sans-serif" font-size="25">Configured by BrandWell. Ready to run real work</text>
    <text x="2" y="365" fill="#b9b5c6" font-family="Arial, Helvetica, sans-serif" font-size="25">across your connected tools.</text>

    <g transform="translate(0 414)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">
      <rect width="190" height="46" rx="23" fill="#181721" stroke="#3b354d" />
      <circle cx="24" cy="23" r="6" fill="#a66cff" />
      <text x="42" y="29" fill="#e7e3ed">Managed skills</text>

      <g transform="translate(204 0)">
        <rect width="208" height="46" rx="23" fill="#181721" stroke="#3b354d" />
        <circle cx="24" cy="23" r="6" fill="#ef5a9d" />
        <text x="42" y="29" fill="#e7e3ed">Dedicated computer</text>
      </g>

      <g transform="translate(426 0)">
        <rect width="190" height="46" rx="23" fill="#181721" stroke="#3b354d" />
        <circle cx="24" cy="23" r="6" fill="#6c7cff" />
        <text x="42" y="29" fill="#e7e3ed">Connected tools</text>
      </g>
    </g>

    <text x="0" y="522" fill="#777280" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.5">BRANDWELL.AI</text>
  </g>

  <g transform="translate(780 105)" filter="url(#shadow)">
    <rect width="348" height="420" rx="30" fill="#15141a" stroke="#35313f" stroke-width="2" />
    <rect x="22" y="22" width="304" height="74" rx="20" fill="#1c1a23" stroke="#302b3c" />
    <circle cx="61" cy="59" r="23" fill="url(#orb)" />
    <ellipse cx="61" cy="59" rx="15" ry="6" fill="#0d0b16" opacity="0.84" />
    <text x="98" y="55" fill="#f5f2f7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">AIMEE</text>
    <circle cx="104" cy="76" r="4" fill="#55d6a2" />
    <text x="115" y="81" fill="#8d8797" font-family="Arial, Helvetica, sans-serif" font-size="13">Ready for work</text>

    <text x="26" y="139" fill="#736d7e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORKSPACE</text>

    <g transform="translate(22 158)" font-family="Arial, Helvetica, sans-serif">
      <rect width="304" height="62" rx="16" fill="#1b1921" />
      <circle cx="28" cy="31" r="12" fill="#6f43dc" opacity="0.35" />
      <path d="M23 31 l4 4 l7 -9" fill="none" stroke="#b18bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="28" fill="#ddd9e3" font-size="15" font-weight="700">Campaign research</text>
      <text x="52" y="47" fill="#77717f" font-size="12">Completed 8:42 AM</text>

      <g transform="translate(0 72)">
        <rect width="304" height="62" rx="16" fill="#1b1921" />
        <circle cx="28" cy="31" r="12" fill="#e55299" opacity="0.28" />
        <path d="M28 24 v8 l5 3" fill="none" stroke="#f188ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="52" y="28" fill="#ddd9e3" font-size="15" font-weight="700">Demand scan</text>
        <text x="52" y="47" fill="#77717f" font-size="12">Next run at 9:00 AM</text>
      </g>

      <g transform="translate(0 144)">
        <rect width="304" height="62" rx="16" fill="#1b1921" />
        <circle cx="28" cy="31" r="12" fill="#4256d9" opacity="0.32" />
        <path d="M22 27 h12 M22 32 h9 M22 37 h6" fill="none" stroke="#8492ff" stroke-width="2" stroke-linecap="round" />
        <text x="52" y="28" fill="#ddd9e3" font-size="15" font-weight="700">Follow-up queue</text>
        <text x="52" y="47" fill="#77717f" font-size="12">4 items ready for review</text>
      </g>
    </g>

    <rect x="22" y="389" width="304" height="8" rx="4" fill="#24212b" />
    <rect x="22" y="389" width="214" height="8" rx="4" fill="url(#brand)" />
  </g>
</svg>
