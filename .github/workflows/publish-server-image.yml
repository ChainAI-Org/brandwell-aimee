name: publish-server-image

# Builds publish only immutable source and exact-version tags. Moving channel aliases are applied
# by promote-server-release.yml after a complete GitHub Release is published and verified.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-server-image.yml"
      - ".github/workflows/promote-server-release.yml"
      - ".github/workflows/release-desktop.yml"
      - "apps/**"
      - "infra/compose/**"
      - "infra/updater/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40
  IMAGE_REPOSITORY: ghcr.io/chainai-org/brandwell-aimee
  RELEASE_PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: publish-server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.name }} image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
          - name: updater
            dockerfile: infra/updater/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.name }}
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.name }}
          provenance: false
          sbom: false

  publish:
    name: Publish ${{ matrix.name }} image
    if: github.event_name != 'pull_request' && github.repository == 'ChainAI-Org/brandwell-aimee'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && 180 || 90 }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: infra/compose/Dockerfile
          - name: updater
            dockerfile: infra/updater/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed official source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Official images must be built from a commit already on main." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release images require a stable vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "The release tag moved or does not resolve to the workflow source commit." >&2
            exit 1
          fi
      - if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && env.RELEASE_PLATFORMS || 'linux/amd64' }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - name: Attest the immutable image digest
        id: attest_image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the release image digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_image.outputs.bundle-path }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digest
          jq -n --arg name "$IMAGE_NAME" --arg repository "${IMAGE_REPOSITORY}/${IMAGE_NAME}" --arg digest "$IMAGE_DIGEST" \
            '{name:$name,repository:$repository,digest:$digest}' > "image-digest/${IMAGE_NAME}.json"
          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
            > "image-digest/server-image-${IMAGE_NAME}.oci-manifest.json"
          [[ "sha256:$(sha256sum "image-digest/server-image-${IMAGE_NAME}.oci-manifest.json" | cut -d' ' -f1)" == "$IMAGE_DIGEST" ]]
          cp "$ATTESTATION_BUNDLE" "image-digest/server-image-${IMAGE_NAME}.sigstore.jsonl"
      - name: Retain the recorded release digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-image-${{ matrix.name }}-${{ github.sha }}
          path: image-digest/*
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: Sign server release manifest
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'ChainAI-Org/brandwell-aimee'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-image-*-${{ github.sha }}
          path: image-digests
          merge-multiple: true
      - name: Create the immutable server release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$SOURCE_COMMIT" ]]
          app_digest="$(jq -er 'select(.name=="app" and .repository=="ghcr.io/chainai-org/brandwell-aimee/app") | .digest' image-digests/app.json)"
          updater_digest="$(jq -er 'select(.name=="updater" and .repository=="ghcr.io/chainai-org/brandwell-aimee/updater") | .digest' image-digests/updater.json)"
          [[ "$app_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$updater_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p server-release
          for asset in server-image-app.oci-manifest.json server-image-app.sigstore.jsonl server-image-updater.oci-manifest.json server-image-updater.sigstore.jsonl; do
            test -s "image-digests/$asset"
            cp "image-digests/$asset" server-release/
          done
          workflow_path=".github/workflows/publish-server-image.yml"
          workflow_ref="refs/tags/${RELEASE_TAG}"
          workflow_identity="https://github.com/${GITHUB_REPOSITORY}/${workflow_path}@${workflow_ref}"
          jq -n --arg releaseTag "$RELEASE_TAG" --arg sourceCommit "$SOURCE_COMMIT" \
            --arg appDigest "$app_digest" --arg updaterDigest "$updater_digest" \
            --arg repository "$GITHUB_REPOSITORY" --arg path "$workflow_path" \
            --arg ref "$workflow_ref" --arg identity "$workflow_identity" \
            --arg runId "$WORKFLOW_RUN_ID" --argjson runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            '{schemaVersion:1,releaseTag:$releaseTag,sourceCommit:$sourceCommit,platforms:["linux/amd64","linux/arm64"],images:{app:{repository:"ghcr.io/chainai-org/brandwell-aimee/app",digest:$appDigest},updater:{repository:"ghcr.io/chainai-org/brandwell-aimee/updater",digest:$updaterDigest}},workflow:{repository:$repository,path:$path,ref:$ref,identity:$identity,runId:$runId,runAttempt:$runAttempt}}' \
            > server-release/server-release-manifest.json
      - name: Attest the server release manifest
        id: attest_manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: server-release/server-release-manifest.json
      - name: Retain the portable Sigstore bundle
        env:
          BUNDLE_PATH: ${{ steps.attest_manifest.outputs.bundle-path }}
        shell: bash
        run: cp "$BUNDLE_PATH" server-release/server-release-manifest.sigstore.jsonl
      - name: Retain the signed release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-release-manifest-${{ github.sha }}
          path: server-release/*
          if-no-files-found: error
          retention-days: 30
