name: deploy-brandwell-staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: main or a full commit SHA already contained in main
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: brandwell-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate requested revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Resolve reviewed immutable revision
        id: revision
        env:
          REQUESTED_REF: ${{ inputs.git_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$REQUESTED_REF" == "main" ]]; then
            deploy_sha="$(git rev-parse "origin/main^{commit}")"
          elif [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]; then
            deploy_sha="$(git rev-parse "${REQUESTED_REF}^{commit}" 2>/dev/null)" || {
              echo "The requested commit is not present in main history." >&2
              exit 1
            }
          else
            echo "Staging accepts only main or a lowercase full commit SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "Staging revisions must already be contained in origin/main." >&2
            exit 1
          fi
          git checkout --detach "$deploy_sha"
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rakazo/db exec prisma generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  deploy:
    name: Deploy BrandWell staging
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: brandwell-staging
      url: https://staging-ai.brandwell.ai
    steps:
      - name: Configure BrandWell staging SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BRANDWELL_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BRANDWELL_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/brandwell-staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/brandwell-staging" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/brandwell-staging" >/dev/null
      - name: Deploy validated revision
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.sha }}
          SSH_HOST: ${{ secrets.BRANDWELL_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.BRANDWELL_STAGING_SSH_USER }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          case "$DEPLOY_SHA" in
            (*[!0-9a-f]*|'') echo "Deployment revision must be a full commit SHA" >&2; exit 1 ;;
          esac
          test "${#DEPLOY_SHA}" -eq 40
          ssh -F /dev/null \
            -i "$HOME/.ssh/brandwell-staging" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" deploy-brandwell-staging "$DEPLOY_SHA"
      - name: Verify BrandWell staging readiness
        env:
          EXPECTED_REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://staging-ai.brandwell.ai/ready)"
          READINESS_RESPONSE="$response" node -e '
            const readiness = JSON.parse(process.env.READINESS_RESPONSE || "null");
            if (readiness?.ok !== true || readiness?.service !== "aimee" || readiness?.revision !== process.env.EXPECTED_REVISION) process.exit(1);
          '
