name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Stable releases must validate and publish serially. Per-tag concurrency would let an older
  # release validate before a newer one publishes, then overwrite GitHub's "latest" pointer.
  group: release-desktop-stable
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, ancestry, and monotonicity
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "ChainAI-Org/brandwell-aimee" ]]; then
            echo "Official desktop releases must run from ChainAI-Org/brandwell-aimee." >&2
            exit 1
          fi
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "Desktop releases must run from a tag, including manual dispatches." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Desktop releases use the stable vMAJOR.MINOR.PATCH channel." >&2
            exit 1
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match desktop version $version." >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The workflow revision does not match the tagged commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Desktop releases must point to a commit already on main." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi

          latest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' |
              sort -V |
              tail -n 1
          )"
          if [[ -n "$latest_tag" ]]; then
            highest="$(printf '%s\n%s\n' "$latest_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
            if [[ "$highest" != "$RELEASE_TAG" || "$latest_tag" == "$RELEASE_TAG" ]]; then
              echo "$RELEASE_TAG must be newer than published release $latest_tag." >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact }} release artifacts
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web --fail-if-no-match build && pnpm --filter @brandwell/desktop --fail-if-no-match build
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Package signed and notarized universal macOS app
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          pnpm --filter @brandwell/desktop --fail-if-no-match exec electron-builder
          --mac --universal --publish never --config.forceCodeSigning=true
      - name: Verify macOS signature, notarization ticket, and update feed
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="apps/desktop/out/mac-universal/BrandWell's AIMEE.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -Fqx "TeamIdentifier=$EXPECTED_TEAM_ID"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          grep -Fqx "provider: github" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "owner: ChainAI-Org" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "repo: brandwell-aimee" "$app/Contents/Resources/app-update.yml"

      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
          EXPECTED_PUBLISHER: ${{ secrets.DESKTOP_WIN_EXPECTED_PUBLISHER }}
        run: |
          set -euo pipefail
          test -n "$WIN_CSC_LINK"
          test -n "$WIN_CSC_KEY_PASSWORD"
          test -n "$EXPECTED_PUBLISHER"
      - name: Package signed x64 Windows app
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
          EXPECTED_PUBLISHER: ${{ secrets.DESKTOP_WIN_EXPECTED_PUBLISHER }}
        run: >-
          pnpm --filter @brandwell/desktop --fail-if-no-match exec electron-builder
          --win --x64 --publish never --config.forceCodeSigning=true
          "--config.win.signtoolOptions.publisherName=$env:EXPECTED_PUBLISHER"
      - name: Verify Windows Authenticode signature and publisher-bound update feed
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ secrets.DESKTOP_WIN_EXPECTED_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER)) {
            throw "The expected Windows publisher is not configured."
          }
          $executables = @(
            Get-ChildItem "apps/desktop/out/*.exe"
            Get-ChildItem "apps/desktop/out/win-unpacked/*.exe"
          )
          if ($executables.Count -lt 2) { throw "Windows installer or application was not created." }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($executable.Name) signature is $($signature.Status)."
            }
            if ($signature.SignerCertificate.Subject -ne $env:EXPECTED_PUBLISHER) {
              throw "$($executable.Name) is signed by an unexpected publisher."
            }
          }
          $config = "apps/desktop/out/win-unpacked/resources/app-update.yml"
          node scripts/verify-windows-update-config.mjs $config $env:EXPECTED_PUBLISHER

      - name: Package x64 Linux AppImage
        if: runner.os == 'Linux'
        run: >-
          pnpm --filter @brandwell/desktop --fail-if-no-match exec electron-builder
          --linux --x64 --publish never
      - name: Verify Linux update feed is pinned to the official GitHub channel
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          config="apps/desktop/out/linux-unpacked/resources/app-update.yml"
          if [[ ! -f "$config" ]]; then
            config="$(find apps/desktop/out -name app-update.yml -print -quit)"
          fi
          test -n "$config"
          test -f "$config"
          grep -Fqx "provider: github" "$config"
          grep -Fqx "owner: ChainAI-Org" "$config"
          grep -Fqx "repo: brandwell-aimee" "$config"
          test -f apps/desktop/out/latest-linux.yml
          grep -Fqx "version: $RELEASE_VERSION" apps/desktop/out/latest-linux.yml

      - name: Retain installers and updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.artifact }}-${{ needs.validate.outputs.sha }}
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.blockmap
            apps/desktop/out/*.dmg
            apps/desktop/out/*.exe
            apps/desktop/out/latest*.yml
            apps/desktop/out/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attest and publish complete release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*-${{ needs.validate.outputs.sha }}
          path: release-artifacts
          merge-multiple: true
      - name: Add and verify the signed server release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 180); do
            run="$(gh run list --workflow publish-server-image.yml --commit "$RELEASE_SHA" --event push --limit 20 \
              --json databaseId,headBranch,status,conclusion \
              --jq "map(select(.headBranch == \"$RELEASE_TAG\"))[0] // {}")"
            status="$(jq -r '.status // ""' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              run_id="$(jq -r .databaseId <<<"$run")"
              break
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "The server image workflow completed with $conclusion." >&2
              exit 1
            fi
            sleep 30
          done
          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for the signed server release manifest." >&2
            exit 1
          fi
          gh run download "$run_id" --name "server-release-manifest-${RELEASE_SHA}" --dir release-artifacts
          manifest="release-artifacts/server-release-manifest.json"
          bundle="release-artifacts/server-release-manifest.sigstore.jsonl"
          test -s "$manifest"
          test -s "$bundle"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-server-image.yml@refs/tags/${RELEASE_TAG}"
          gh attestation verify "$manifest" --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-server-image.yml" \
            --cert-identity "$identity" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-digest "$RELEASE_SHA" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --deny-self-hosted-runners
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg identity "$identity" '
            .schemaVersion == 1 and .releaseTag == $tag and .sourceCommit == $sha and
            .platforms == ["linux/amd64","linux/arm64"] and
            .workflow.repository == "ChainAI-Org/brandwell-aimee" and
            .workflow.path == ".github/workflows/publish-server-image.yml" and
            .workflow.ref == ("refs/tags/" + $tag) and .workflow.identity == $identity and
            (.images.app.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.images.updater.digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$manifest" >/dev/null
      - name: Verify the complete stable update feed
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "The release tag moved after the build started." >&2
            exit 1
          fi

          compgen -G 'release-artifacts/*.dmg' >/dev/null
          compgen -G 'release-artifacts/*.zip' >/dev/null
          compgen -G 'release-artifacts/*.exe' >/dev/null
          compgen -G 'release-artifacts/*.AppImage' >/dev/null
          node scripts/verify-desktop-update-feeds.mjs release-artifacts "$RELEASE_VERSION"

          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*
      - name: Create draft and upload every platform
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release-artifacts/*
          --draft --generate-notes --title "BrandWell's AIMEE $RELEASE_TAG" --verify-tag
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove an incomplete draft
        if: failure() && steps.create_release.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft 2>/dev/null)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
